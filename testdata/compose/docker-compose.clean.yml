services:
  web:
    image: nginx:1.25.3
    restart: unless-stopped
    ports:
      - "8080:80"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    depends_on:
      - api

  api:
    image: myorg/api:1.4.2
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
    volumes:
      - api-data:/var/lib/api
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

volumes:
  api-data:
